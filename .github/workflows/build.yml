name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build every plugin
        run: mvn -B package
      - name: Collect jars
        run: |
          mkdir -p dist
          find . -path '*/target/*.jar' ! -name 'original-*' -exec cp {} dist/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: dork-jars
          path: dist/*.jar
